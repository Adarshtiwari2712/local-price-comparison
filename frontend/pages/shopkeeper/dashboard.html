<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>Shopkeeper Dashboard</title>

  <link
          rel="stylesheet"
          href="../../css/dashboard.css"
  >

</head>


<body>


<div class="dashboard-container">


  <!-- ========================================= -->
  <!-- HEADER -->
  <!-- ========================================= -->

  <header class="dashboard-header">

    <div>

      <h1>Shopkeeper Dashboard</h1>

      <p id="headerStoreName">
        Loading store...
      </p>

    </div>


    <button
            class="logout-btn"
            onclick="logout()"
    >
      Logout
    </button>

  </header>



  <!-- ========================================= -->
  <!-- STATS -->
  <!-- ========================================= -->

  <section class="stats-container">


    <div class="stat-card">

      <h3>My Store</h3>

      <p id="storeCount">
        0
      </p>

    </div>


    <div class="stat-card">

      <h3>My Products</h3>

      <p id="productCount">
        0
      </p>

    </div>


    <div class="stat-card">

      <h3>My Prices</h3>

      <p id="priceCount">
        0
      </p>

    </div>


  </section>



  <!-- ========================================= -->
  <!-- MENU BUTTONS -->
  <!-- ========================================= -->

  <section class="menu-container">


    <button
            onclick="showPanel('storePanel')"
    >
      Manage Store
    </button>


    <button
            onclick="showPanel('productsPanel')"
    >
      Manage Products
    </button>


    <button
            onclick="showPanel('pricesPanel')"
    >
      Manage Prices
    </button>


    <button
            onclick="showPanel('addProductPanel')"
    >
      Add Product
    </button>


  </section>



  <!-- ========================================= -->
  <!-- STORE PANEL -->
  <!-- ========================================= -->

  <section
          id="storePanel"
          class="dashboard-panel"
  >

    <h2>Manage Store</h2>


    <div class="form-group">

      <label>
        Store Name
      </label>

      <input
              type="text"
              id="editStoreName"
              placeholder="Store name"
      >

    </div>


    <div class="form-group">

      <label>
        Address
      </label>

      <input
              type="text"
              id="editStoreAddress"
              placeholder="Store address"
      >

    </div>


    <div class="form-group">

      <label>
        Phone
      </label>

      <input
              type="text"
              id="editStorePhone"
              placeholder="Phone number"
      >

    </div>


    <button
            onclick="updateStore()"
    >
      Update Store
    </button>


    <div class="store-details">

      <h3>Current Store Details</h3>

      <p>
        <strong>Name:</strong>

        <span id="storeName">
                    -
                </span>
      </p>


      <p>
        <strong>Address:</strong>

        <span id="storeAddress">
                    -
                </span>
      </p>


      <p>
        <strong>Phone:</strong>

        <span id="storePhone">
                    -
                </span>
      </p>

    </div>

  </section>



  <!-- ========================================= -->
  <!-- PRODUCTS PANEL -->
  <!-- ========================================= -->

  <section
          id="productsPanel"
          class="dashboard-panel"
  >

    <h2>My Products</h2>


    <div id="productsList">

      <p>
        Loading products...
      </p>

    </div>

  </section>



  <!-- ========================================= -->
  <!-- PRICES PANEL -->
  <!-- ========================================= -->

  <section
          id="pricesPanel"
          class="dashboard-panel"
  >

    <h2>My Prices</h2>


    <div id="pricesList">

      <p>
        Loading prices...
      </p>

    </div>

  </section>



  <!-- ========================================= -->
  <!-- ADD PRODUCT PANEL -->
  <!-- ========================================= -->

  <section
          id="addProductPanel"
          class="dashboard-panel"
  >

    <h2>Add Product</h2>


    <div class="form-group">

      <label>
        Product Name
      </label>

      <input
              type="text"
              id="addProductName"
              placeholder="Example: Milk"
      >

    </div>


    <div class="form-group">

      <label>
        Price
      </label>

      <input
              type="number"
              id="addProductPrice"
              placeholder="Example: 50"
              min="1"
      >

    </div>


    <div class="form-group">

      <label>
        Availability
      </label>

      <select
              id="addProductAvailable"
      >

        <option value="true">
          Available
        </option>

        <option value="false">
          Not Available
        </option>

      </select>

    </div>


    <button
            onclick="addProduct()"
    >
      Add Product
    </button>


  </section>


</div>



<script
        src="../../js/dashboard.js"
></script>


</body>

</html>
