<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Select Role - Local Price Compare</title>

    <link rel="stylesheet" href="../css/role.css">

</head>

<body>

<div class="role-page">

    <!-- =========================
         HEADING
    ========================== -->

    <h1>Choose Your Role</h1>

    <p>
        How would you like to use Local Price Compare?
    </p>


    <!-- =========================
         ROLE CARDS
    ========================== -->

    <div class="role-container">


        <!-- =========================
             USER
        ========================== -->

        <div class="role-card" id="userRole">

            <div class="role-icon">
                🛒
            </div>

            <h2>User</h2>

            <p>
                Search products and compare prices
                from nearby local shops.
            </p>

            <button id="userButton">
                Continue as User →
            </button>

        </div>


        <!-- =========================
             SHOPKEEPER
        ========================== -->

        <div class="role-card" id="shopkeeperRole">

            <div class="role-icon">
                🏪
            </div>

            <h2>Shopkeeper</h2>

            <p>
                Manage your store, products,
                prices and availability.
            </p>

            <button id="shopkeeperButton">
                Continue as Shopkeeper →
            </button>

        </div>

    </div>


    <!-- =========================
         BACK BUTTON
    ========================== -->

    <button class="back-button" id="backButton">
        ← Back
    </button>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="../js/navigation.js"></script>

</body>

</html>
